
<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Boyut Hesaplayıcı</title>

<style>

@import url('https://fonts.cdnfonts.com/css/limon-milk');

/* =========================
   TEMEL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {

    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    font-family: 'Lemon/Milk', sans-serif;

    background:

        radial-gradient(
            circle at 20% 20%,
            rgba(255, 105, 180, 0.25),
            transparent 35%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(138, 43, 226, 0.25),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #16001f,
            #3b0b45,
            #13001c
        );

    color: white;
}


/* =========================
   ANA KUTU
========================= */

.container {

    width: 100%;
    max-width: 650px;

    padding: 50px 35px;

    text-align: center;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid
        rgba(255,255,255,0.14);

    border-radius: 30px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,0.35);

    animation:
        containerIn 0.6s ease;

    position: relative;

    z-index: 5;
}


@keyframes containerIn {

    from {

        opacity: 0;

        transform:
            translateY(20px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================
   BAŞLIK
========================= */

h1 {

    font-size:
        clamp(
            26px,
            6vw,
            42px
        );

    line-height: 1.35;

    margin-bottom: 20px;

    text-shadow:
        0 0 12px
        rgba(
            255,
            105,
            180,
            0.55
        );
}


/* =========================
   AÇIKLAMA
========================= */

.subtitle {

    font-size: 14px;

    line-height: 1.7;

    color:
        rgba(
            255,
            255,
            255,
            0.70
        );

    margin-bottom: 30px;
}


/* =========================
   BUTONLAR
========================= */

.buttons {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 18px;

    flex-wrap: wrap;
}


button {

    min-width: 150px;

    padding: 15px 35px;

    border: none;

    border-radius: 999px;

    color: white;

    font-family: inherit;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

    -webkit-tap-highlight-color:
        transparent;
}


.gender-button {

    background:
        linear-gradient(
            135deg,
            #ff4fa3,
            #b85cff
        );

    box-shadow:
        0 8px 22px
        rgba(
            255,
            79,
            163,
            0.30
        );
}


/* =========================
   HESAPLAYICI
========================= */

.calculator {

    display: none;

    animation:
        resultIn 0.5s ease;
}


.input-group {

    margin-bottom: 18px;

    text-align: left;
}


label {

    display: block;

    margin-bottom: 8px;

    font-size: 14px;

    color:
        rgba(
            255,
            255,
            255,
            0.80
        );
}


input {

    width: 100%;

    padding: 16px 20px;

    border-radius: 999px;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.18
        );

    background:
        rgba(
            255,
            255,
            255,
            0.08
        );

    color: white;

    font-family: inherit;

    font-size: 16px;

    outline: none;
}


input:focus {

    border-color:
        rgba(
            255,
            79,
            163,
            0.8
        );

    box-shadow:
        0 0 18px
        rgba(
            255,
            79,
            163,
            0.25
        );
}


input::placeholder {

    color:
        rgba(
            255,
            255,
            255,
            0.35
        );
}


.calculate-button {

    margin-top: 15px;

    background:
        linear-gradient(
            135deg,
            #ff4fa3,
            #ff79bd
        );

    box-shadow:
        0 8px 22px
        rgba(
            255,
            79,
            163,
            0.30
        );
}


/* =========================
   SONUÇ
========================= */

#result {

    display: none;

    margin-top: 30px;

    animation:
        resultIn 0.4s ease;
}


@keyframes resultIn {

    from {

        opacity: 0;

        transform:
            scale(0.95)
            translateY(8px);

    }

    to {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);

    }
}


.message-box {

    padding: 25px 20px;

    border-radius: 22px;

    background:
        rgba(
            255,
            255,
            255,
            0.08
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.14
        );

    box-shadow:
        0 10px 30px
        rgba(
            0,
            0,
            0,
            0.25
        );
}


.category {

    font-size: 28px;

    margin-bottom: 12px;

    color: #ff79bd;
}


.percentile {

    font-size: 22px;

    font-weight: bold;

    margin-bottom: 18px;
}


.detail {

    font-size: 14px;

    line-height: 1.7;

    margin-bottom: 15px;

    color:
        rgba(
            255,
            255,
            255,
            0.75
        );
}


.message {

    font-size: 15px;

    line-height: 1.7;

    color:
        rgba(
            255,
            255,
            255,
            0.90
        );
}


/* =========================
   SONRAKİ BUTON
========================= */

.next-button {

    display: flex;

    align-items: center;

    justify-content: center;

    width: 55px;

    height: 55px;

    min-width: 55px;

    padding: 0;

    margin: 22px auto 0;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #ff4fa3,
            #b85cff
        );

    box-shadow:
        0 7px 20px
        rgba(
            255,
            79,
            163,
            0.35
        );

    font-size: 25px;
}


/* =========================
   FİNAL
========================= */

.final-page {

    display: none;

    animation:
        resultIn 0.5s ease;
}


.final-image {

    width: 100%;

    max-width: 350px;

    margin: 25px auto 0;

    border-radius: 25px;

    display: none;
}


/* =========================
   KALPLER
========================= */

.heart {

    position: fixed;

    bottom: -30px;

    font-size: 20px;

    opacity: 0.35;

    pointer-events: none;

    animation:
        heartRise 9s linear infinite;

    z-index: 1;
}


@keyframes heartRise {

    0% {

        transform:
            translateY(0)
            rotate(0deg);

        opacity: 0;

    }

    15% {
        opacity: 0.35;
    }

    85% {
        opacity: 0.25;
    }

    100% {

        transform:
            translateY(-110vh)
            rotate(180deg);

        opacity: 0;

    }
}


/* =========================
   HOVER
========================= */

@media (hover: hover) {

    button:hover {

        transform:
            translateY(-3px)
            scale(1.03);

    }

}


button:active {

    transform:
        scale(0.96);

}


/* =========================
   MOBİL
========================= */

@media (max-width: 600px) {

    body {

        padding: 15px;

    }

    .container {

        padding:
            35px 20px;

        border-radius:
            25px;

    }

    h1 {

        font-size:
            clamp(
                24px,
                8vw,
                34px
            );

    }

    button {

        min-width:
            130px;

        padding:
            14px 25px;

        font-size:
            14px;

    }

}


/* =========================
   HAREKET
========================= */

@media (prefers-reduced-motion: reduce) {

    * {

        animation:
            none !important;

        transition:
            none !important;

    }

}

</style>

</head>


<body>


<!-- =========================
     KALPLER
========================= -->

<div
    class="heart"
    style="left:10%; animation-delay:0s;"
>
    💖
</div>

<div
    class="heart"
    style="left:35%; animation-delay:3s;"
>
    ♡
</div>

<div
    class="heart"
    style="left:65%; animation-delay:5s;"
>
    💗
</div>

<div
    class="heart"
    style="left:85%; animation-delay:1s;"
>
    ♡
</div>



<!-- =========================
     ANA KUTU
========================= -->

<main class="container">


<!-- =========================
     CİNSİYET SEÇİMİ
========================= -->

<section id="genderPage">

    <h1>
        Hoş Geldin 👋💖
    </h1>

    <p class="subtitle">

        Hesaplamaya devam etmek için
        cinsiyetini seç.

    </p>


    <div class="buttons">

        <button
            class="gender-button"
            onclick="selectGender('Erkek')"
        >
            👨 Erkek
        </button>


        <button
            class="gender-button"
            onclick="selectGender('Kadın')"
        >
            👩 Kadın
        </button>

    </div>

</section>



<!-- =========================
     HESAPLAYICI
========================= -->

<section
    id="calculatorPage"
    class="calculator"
>

    <h1>
        Penis Boyu Hesaplayıcı 📏
    </h1>


    <p class="subtitle">

        Sertleşmiş uzunluğunu ve çevresini
        santimetre olarak gir.
        Sonuç, klinik ölçümlere dayalı
        yaklaşık bir persentil olarak
        hesaplanır.

    </p>


    <div class="input-group">

        <label for="length">
            Sertleşmiş uzunluk (cm)
        </label>

        <input
            type="text"
            inputmode="decimal"
            id="length"
            placeholder="Örn: 13,5"
        >

    </div>


    <div class="input-group">

        <label for="girth">
            Sertleşmiş çevre (cm)
        </label>

        <input
            type="text"
            inputmode="decimal"
            id="girth"
            placeholder="Örn: 11,5"
        >

    </div>


    <button
        class="calculate-button"
        onclick="calculate()"
    >
        Hesapla ✨
    </button>

</section>



<!-- =========================
     SONUÇ
========================= -->

<section id="result">

    <div class="message-box">

        <div
            class="category"
            id="category"
        ></div>


        <div
            class="percentile"
            id="percentile"
        ></div>


        <div
            class="detail"
            id="detail"
        ></div>


        <div
            class="message"
            id="message"
        ></div>

    </div>


    <button
        class="next-button"
        onclick="showFinal()"
    >
        →
    </button>

</section>



<!-- =========================
     FİNAL
========================= -->

<section
    id="finalPage"
    class="final-page"
>

    <h1 id="finalTitle">
        Sonucun ✨
    </h1>


    <div class="message-box">

        <div
            class="message"
            id="finalMessage"
        ></div>

    </div>


    <!--
        BURAYA RESİM GELECEK.

        Örneğin:

        "images/buyuk.jpg"

        şeklinde aşağıdaki JavaScript
        bölümüne yazabilirsin.
    -->

    <img
        id="finalImage"
        class="final-image"
        alt="Sonuç görseli"
    >

</section>


</main>



<script>


/* =====================================================
   DEĞİŞKENLER
===================================================== */

let selectedGender = "";

let selectedCategory = "";


/* =====================================================
   CİNSİYET
===================================================== */

function selectGender(gender) {

    selectedGender = gender;


    document
        .getElementById("genderPage")
        .style.display = "none";


    document
        .getElementById("calculatorPage")
        .style.display = "block";

}


/* =====================================================
   TÜRKÇE / İNGİLİZCE SAYI OKUMA

   13,5  -> 13.5
   13.5  -> 13.5
===================================================== */

function parseNumber(value) {

    if (!value) {
        return NaN;
    }


    value = value
        .trim()
        .replace(",", ".");


    return Number(value);

}


/* =====================================================
   ERROR FUNCTION
===================================================== */

function erf(x) {

    const sign =
        x >= 0 ? 1 : -1;

    x = Math.abs(x);


    const a1 =
        0.254829592;

    const a2 =
        -0.284496736;

    const a3 =
        1.421413741;

    const a4 =
        -1.453152027;

    const a5 =
        1.061405429;

    const p =
        0.3275911;


    const t =
        1 /
        (
            1 +
            p * x
        );


    const y =
        1 -
        (
            (
                (
                    (
                        (
                            a5 * t +
                            a4
                        ) * t +
                        a3
                    ) * t +
                    a2
                ) * t +
                a1
            ) *
            t *
            Math.exp(
                -x * x
            )
        );


    return sign * y;

}


/* =====================================================
   NORMAL DISTRIBUTION

   Z değerinden yüzdelik hesaplar.
===================================================== */

function normalCDF(z) {

    return (
        0.5 *
        (
            1 +
            erf(
                z /
                Math.sqrt(2)
            )
        )
    );

}


/* =====================================================
   UZUNLUK PERCENTILE

   Ortalama: 13.12 cm
   SD: 1.66 cm

   Veale et al. 2015
===================================================== */

function getLengthPercentile(length) {

    const mean =
        13.12;

    const sd =
        1.66;


    const z =
        (
            length -
            mean
        ) / sd;


    return (
        normalCDF(z) *
        100
    );

}


/* =====================================================
   ÇEVRE PERCENTILE

   Ortalama: 11.66 cm
   SD: 1.10 cm

   Veale et al. 2015
===================================================== */

function getGirthPercentile(girth) {

    const mean =
        11.66;

    const sd =
        1.10;


    const z =
        (
            girth -
            mean
        ) / sd;


    return (
        normalCDF(z) *
        100
    );

}


/* =====================================================
   SINIRLA
===================================================== */

function clampPercentile(value) {

    return Math.max(
        0.1,
        Math.min(
            99.9,
            value
        )
    );

}


/* =====================================================
   KATEGORİ
===================================================== */

function getCategory(percentile) {

    if (percentile < 5) {

        return "Çok Küçük";

    }

    if (percentile < 25) {

        return "Küçük";

    }

    if (percentile < 75) {

        return "Ortalama";

    }

    if (percentile < 95) {

        return "Büyük";

    }

    return "Mega";

}


/* =====================================================
   HESAPLA
===================================================== */

function calculate() {


    /* ---------------------------------
       DEĞERLERİ AL
    --------------------------------- */

    const length =
        parseNumber(
            document
                .getElementById("length")
                .value
        );


    const girth =
        parseNumber(
            document
                .getElementById("girth")
                .value
        );


    /* ---------------------------------
       KONTROL
    --------------------------------- */

    if (
        !Number.isFinite(length) ||
        !Number.isFinite(girth)
    ) {

        alert(
            "Lütfen uzunluk ve çevre değerlerini gir."
        );

        return;

    }


    if (
        length <= 0 ||
        girth <= 0
    ) {

        alert(
            "Lütfen 0'dan büyük geçerli ölçüler gir."
        );

        return;

    }


    /* ---------------------------------
       GERÇEK HESAPLAMA
    --------------------------------- */


    const lengthPercentile =
        clampPercentile(
            getLengthPercentile(
                length
            )
        );


    const girthPercentile =
        clampPercentile(
            getGirthPercentile(
                girth
            )
        );


    /* ---------------------------------
       İKİ PERCENTILE'I BİRLEŞTİR

       %50 uzunluk
       %50 çevre
    --------------------------------- */

    const overallPercentile =
        (
            lengthPercentile +
            girthPercentile
        ) / 2;


    /* ---------------------------------
       KATEGORİ
    --------------------------------- */

    selectedCategory =
        getCategory(
            overallPercentile
        );


    /* ---------------------------------
       MESAJ
    --------------------------------- */

    const messages = {

        "Çok Küçük":
            "Ölçümünüz referans dağılımın en alt yüzdeliklerinde bulunuyor.",

        "Küçük":
            "Ölçümünüz referans dağılımın ortalamanın altında kalan bölümünde bulunuyor.",

        "Ortalama":
            "Ölçümünüz referans dağılımın orta bölümünde bulunuyor.",

        "Büyük":
            "Ölçümünüz referans dağılımın üst bölümünde bulunuyor.",

        "Mega":
            "Ölçümünüz referans dağılımın en üst yüzdeliklerinde bulunuyor."

    };


    /* ---------------------------------
       EKRANA YAZ
    --------------------------------- */

    document
        .getElementById("category")
        .textContent =
        selectedCategory;


    document
        .getElementById("percentile")
        .textContent =

        "Yaklaşık %" +
        overallPercentile.toFixed(1) +
        " persentil";


    document
        .getElementById("detail")
        .innerHTML =

        "📏 Uzunluk: <b>%" +
        lengthPercentile.toFixed(1) +
        "</b><br>" +

        "⭕ Çevre: <b>%" +
        girthPercentile.toFixed(1) +
        "</b>";


    document
        .getElementById("message")
        .textContent =
        messages[selectedCategory];


    /* ---------------------------------
       SAYFALARI DEĞİŞTİR
    --------------------------------- */

    document
        .getElementById("calculatorPage")
        .style.display =
        "none";


    document
        .getElementById("result")
        .style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   FİNAL SAYFASI
===================================================== */

function showFinal() {


    document
        .getElementById("result")
        .style.display =
        "none";


    document
        .getElementById("finalPage")
        .style.display =
        "block";


    /* ---------------------------------
       KATEGORİ MESAJLARI
    --------------------------------- */

    const finalTexts = {

        "Çok Küçük":
            "Çok Küçük kategorisine özel yazını buraya ekleyebilirsin.",

        "Küçük":
            "Küçük kategorisine özel yazını buraya ekleyebilirsin.",

        "Ortalama":
            "Ortalama kategorisine özel yazını buraya ekleyebilirsin.",

        "Büyük":
            "Büyük kategorisine özel yazını buraya ekleyebilirsin.",

        "Mega":
            "Mega kategorisine özel yazını buraya ekleyebilirsin."

    };


    document
        .getElementById("finalTitle")
        .textContent =
        selectedCategory +
        " Kategorisi ✨";


    document
        .getElementById("finalMessage")
        .textContent =
        finalTexts[selectedCategory];


    /* ---------------------------------
       RESİMLER

       BURAYA KENDİ RESİMLERİNİ YAZ
    --------------------------------- */

    const images = {

        "Çok Küçük":
            "",

        "Küçük":
            "",

        "Ortalama":
            "",

        "Büyük":
            "",

        "Mega":
            ""

    };


    const image =
        document
            .getElementById(
                "finalImage"
            );


    if (
        images[selectedCategory]
    ) {

        image.src =
            images[selectedCategory];

        image.style.display =
            "block";

    }

}

</script>

</body>

</html>
