<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Tatlı Kız Meliss 💖</title>

    <style>

        @import url('https://fonts.cdnfonts.com/css/limon-milk');


        /* =========================
           TEMEL AYARLAR
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }


        body {

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: 'Lemon/Milk', sans-serif;

            background:

                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 105, 180, 0.25),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(138, 43, 226, 0.25),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #16001f,
                    #3b0b45,
                    #13001c
                );

            color: white;
        }


        /* =========================
           ANA KUTU
        ========================== */

        .container {

            width: 100%;
            max-width: 650px;

            padding: 50px 35px;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.07);

            border:
                1px solid rgba(255, 255, 255, 0.14);

            border-radius: 30px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.35);

            animation:
                containerIn 0.6s ease;

            position: relative;
            z-index: 5;
        }


        @keyframes containerIn {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================
           BAŞLIK
        ========================== */

        h1 {

            font-size:
                clamp(
                    26px,
                    6vw,
                    46px
                );

            line-height: 1.35;

            margin-bottom: 35px;

            text-shadow:
                0 0 12px rgba(
                    255,
                    105,
                    180,
                    0.55
                );
        }


        /* =========================
           SORU NUMARASI
        ========================== */

        .question-number {

            font-size: 13px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.55
                );

            margin-bottom: 12px;

            letter-spacing: 1px;
        }


        /* =========================
           BUTONLAR
        ========================== */

        .buttons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 18px;

            flex-wrap: wrap;
        }


        button {

            min-width: 150px;

            padding: 15px 35px;

            border: none;

            border-radius: 999px;

            color: white;

            font-family: inherit;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

            -webkit-tap-highlight-color:
                transparent;
        }


        /* =========================
           EVET
        ========================== */

        .yes {

            background:
                linear-gradient(
                    135deg,
                    #ff4fa3,
                    #ff79bd
                );

            box-shadow:
                0 8px 22px rgba(
                    255,
                    79,
                    163,
                    0.30
                );
        }


        /* =========================
           HAYIR
        ========================== */

        .no {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    0.20
                );
        }


        /* =========================
           CEVAP ALANI
        ========================== */

        #result {

            display: none;

            margin-top: 30px;

            animation:
                resultIn 0.4s ease;
        }


        @keyframes resultIn {

            from {

                opacity: 0;

                transform:
                    scale(0.95)
                    translateY(8px);
            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }

        }


        /* =========================
           CEVAP KUTUSU
        ========================== */

        .message-box {

            padding: 22px 20px;

            border-radius: 22px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    0.14
                );

            box-shadow:
                0 10px 30px rgba(
                    0,
                    0,
                    0,
                    0.25
                );
        }


        .message {

            font-size: 16px;

            line-height: 1.6;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.90
                );
        }


        /* =========================
           SONRAKİ SORU BUTONU
        ========================== */

        .next-button {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 48px;

            height: 48px;

            min-width: 48px;

            padding: 0;

            margin: 20px auto 0;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #ff4fa3,
                    #b85cff
                );

            box-shadow:
                0 7px 20px rgba(
                    255,
                    79,
                    163,
                    0.35
                );

            font-size: 22px;
        }


        /* =========================
           SES BUTONU
        ========================== */

        .music-button {

            position: fixed;

            bottom:
                calc(
                    20px +
                    env(safe-area-inset-bottom)
                );

            right: 20px;

            width: 52px;

            height: 52px;

            min-width: 52px;

            padding: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    0.20
                );

            box-shadow:
                0 8px 25px rgba(
                    0,
                    0,
                    0,
                    0.30
                );

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            font-size: 21px;

            z-index: 100;

            margin: 0;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }


        .music-button:hover {

            transform:
                translateY(-3px)
                scale(1.05);
        }


        .music-button:active {

            transform:
                scale(0.92);
        }


        /* =========================
           KALPLER
        ========================== */

        .heart {

            position: fixed;

            bottom: -30px;

            font-size: 20px;

            opacity: 0.35;

            pointer-events: none;

            animation:
                heartRise 9s linear infinite;

            z-index: 1;
        }


        @keyframes heartRise {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: 0.35;
            }

            85% {
                opacity: 0.25;
            }

            100% {

                transform:
                    translateY(-110vh)
                    rotate(180deg);

                opacity: 0;
            }

        }


        /* =========================
           HOVER
        ========================== */

        @media (hover: hover) {

            button:hover {

                transform:
                    translateY(-3px)
                    scale(1.03);
            }

        }


        button:active {

            transform:
                scale(0.96);
        }


        /* =========================
           MOBİL
        ========================== */

        @media (max-width: 600px) {

            body {

                padding: 15px;

                align-items: center;
            }


            .container {

                padding:
                    35px 20px;

                border-radius:
                    25px;
            }


            h1 {

                font-size:
                    clamp(
                        24px,
                        8vw,
                        34px
                    );

                margin-bottom:
                    28px;
            }


            .buttons {

                gap:
                    12px;
            }


            button {

                min-width:
                    130px;

                padding:
                    14px 25px;

                font-size:
                    15px;
            }


            .message {

                font-size:
                    14px;
            }


            .music-button {

                width: 48px;

                height: 48px;

                min-width: 48px;

                right: 15px;

                bottom:
                    calc(
                        15px +
                        env(safe-area-inset-bottom)
                    );
            }

        }


        /* =========================
           ÇOK KÜÇÜK TELEFON
        ========================== */

        @media (max-width: 380px) {

            .container {

                padding:
                    30px 16px;
            }


            h1 {

                font-size:
                    23px;
            }


            button {

                min-width:
                    120px;

                padding:
                    13px 20px;

                font-size:
                    14px;
            }

        }


        /* =========================
           HAREKET AYARI
        ========================== */

        @media (
            prefers-reduced-motion: reduce
        ) {

            * {

                animation:
                    none !important;

                transition:
                    none !important;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         ARKA PLAN MÜZİĞİ
    ========================== -->

    <audio
        id="backgroundMusic"
        loop
        preload="auto"
    >

        <source
            src="muzik.mp3"
            type="audio/mpeg"
        >

    </audio>


    <!-- =========================
         KALPLER
    ========================== -->

    <div
        class="heart"
        style="
            left: 10%;
            animation-delay: 0s;
        "
    >
        💖
    </div>


    <div
        class="heart"
        style="
            left: 35%;
            animation-delay: 3s;
        "
    >
        ♡
    </div>


    <div
        class="heart"
        style="
            left: 65%;
            animation-delay: 5s;
        "
    >
        💗
    </div>


    <div
        class="heart"
        style="
            left: 85%;
            animation-delay: 1s;
        "
    >
        ♡
    </div>


    <!-- =========================
         ANA İÇERİK
    ========================== -->

    <main class="container">


        <div
            class="question-number"
            id="questionNumber"
        >
            SORU 1 / 6
        </div>


        <h1 id="question">

            Selamlar. Otoyolda 269 km Hızla Gidiyorsun Çünkü Sen Bir Malsın Ve Önüne Bir Kedi Çıkıyor Sağ Şerittede Bir Tane Tavşan Var Hangi Şerite Geçerdin ? 🧐 Sivri zekalık yapıp iki şeridin ortasından gidemezsin amk 😇 

        </h1>


        <!-- =========================
             CEVAP BUTONLARI
        ========================== -->

        <div
            class="buttons"
            id="buttons"
        >

            <button
                class="yes"
                onclick="answer(0)"
            >
                Kedi
            </button>


            <button
                class="no"
                onclick="answer(1)"
            >
                Tavşan
            </button>

        </div>


        <!-- =========================
             CEVAP
        ========================== -->

        <div id="result">

            <div class="message-box">

                <div
                    class="message"
                    id="message"
                ></div>

            </div>


            <button
                class="next-button"
                id="nextButton"
                onclick="nextQuestion()"
            >
                →
            </button>

        </div>


    </main>


    <!-- =========================
         MÜZİK BUTONU
    ========================== -->

    <button
        class="music-button"
        id="musicButton"
        onclick="toggleMusic()"
        aria-label="Müziği aç veya kapat"
    >
        🔇
    </button>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>


        /* =========================
           SORULAR
        ========================== */

        const questions = [

            {
                question:
                    "Selamlar. Otoyolda 269 km Hızla Gidiyorsun Çünkü Sen Bir Malsın Ve Önüne Bir Kedi Çıkıyor Sağ Şerittede Bir Tane Tavşan Var Hangi Şerite Geçerdin ? 🧐 Sivri zekalık yapıp iki şeridin ortasından gidemezsin amk 😇 ",

                answers: [
                    "Tebriklerrrr Diğer Şeritte Ölü Bir Kedi Var . Ama Seni Suçlamıyoruz Belki Tavşanları Daha Çok Seviyorsun amk 😊 ",
                    " Tebriklerrr Diğer Şeritte Ölü Bir Tavşan Var . Ama Seni Suçlamıyoruz Belki Kedileri Daha Çok Seviyorsun amk 😊 "
                ]
            },


            {
                question:
                    "Beni biraz özledin mi ? 🥺💗",

                answers: [
                    "Awww bunu duymak güzeldi 🥹💖",
                    "Yalan söylüyorsun gibi geldi bana 😝"
                ]
            },


            {
                question:
                    "Ben sence tatlı mıyım ? 😌💖",

                answers: [
                    "Bunu zaten biliyordum 😎💗",
                    "Tamam tamam, bunu unutuyorum 😭"
                ]
            },


            {
                question:
                    "Benimle konuşmayı seviyor musun ? 🧐💞",

                answers: [
                    "İşte bunu duymak istiyordum 🥰",
                    "Kalbim biraz kırıldı ama olsun 😭"
                ]
            },


            {
                question:
                    "Sence beraber çok eğlenir miyiz ? 😝💖",

                answers: [
                    "Kesinlikle! Kaçışın yok artık 😈💗",
                    "Bence seni ikna etmem gerekecek 😏"
                ]
            },


            {
                question:
                    "Son bir soru...<br>Beni seviyor musun ? 👀💖",

                answers: [
                    "Hehehe bunu ekran görüntüsü alıyorum 😝💖",
                    "Ben yine de seni seviyorum 🥹💗"
                ]
            }

        ];


        /* =========================
           DEĞİŞKENLER
        ========================== */

        let currentQuestion = 0;


        const music =
            document.getElementById(
                "backgroundMusic"
            );


        const musicButton =
            document.getElementById(
                "musicButton"
            );


        let musicPlaying = false;


        /* =========================
           MÜZİĞİ BAŞLAT
        ========================== */

        function startMusic() {

            music.volume = 0.35;


            music.play()
                .then(() => {

                    musicPlaying = true;

                    musicButton.textContent =
                        "🔊";

                })
                .catch(() => {

                    /*
                     Tarayıcı otomatik
                     oynatmayı engellerse
                     ilk dokunuşta başlayacak.
                    */

                    musicPlaying = false;

                    musicButton.textContent =
                        "🔇";

                });

        }


        /* =========================
           MÜZİK AÇ / KAPAT
        ========================== */

        function toggleMusic() {

            if (music.paused) {

                music.volume = 0.35;

                music.play()
                    .then(() => {

                        musicPlaying = true;

                        musicButton.textContent =
                            "🔊";

                    })
                    .catch(() => {

                        musicPlaying = false;

                        musicButton.textContent =
                            "🔇";

                    });

            } else {

                music.pause();

                musicPlaying = false;

                musicButton.textContent =
                    "🔇";

            }

        }


        /* =========================
           İLK DOKUNUŞTA MÜZİĞİ BAŞLAT
        ========================== */

        function firstInteraction() {

            if (!musicPlaying) {

                startMusic();

            }

            document.removeEventListener(
                "touchstart",
                firstInteraction
            );

            document.removeEventListener(
                "click",
                firstInteraction
            );

        }


        document.addEventListener(
            "touchstart",
            firstInteraction,
            {
                once: true
            }
        );


        document.addEventListener(
            "click",
            firstInteraction,
            {
                once: true
            }
        );


        /*
         Sayfa açılır açılmaz
         müziği başlatmayı dene.
        */

        window.addEventListener(
            "load",
            () => {

                startMusic();

            }
        );


        /* =========================
           CEVAP SEÇİMİ
        ========================== */

        function answer(choice) {

            const result =
                document.getElementById(
                    "result"
                );


            const message =
                document.getElementById(
                    "message"
                );


            const buttons =
                document.getElementById(
                    "buttons"
                );


            message.textContent =
                questions[
                    currentQuestion
                ].answers[choice];


            buttons.style.display =
                "none";


            result.style.display =
                "block";


            const nextButton =
                document.getElementById(
                    "nextButton"
                );


            if (
                currentQuestion ===
                questions.length - 1
            ) {

                nextButton.textContent =
                    "💖";

            } else {

                nextButton.textContent =
                    "→";

            }


            setTimeout(() => {

                result.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

            }, 100);

        }


        /* =========================
           SONRAKİ SORU
        ========================== */

        function nextQuestion() {

            if (
                currentQuestion ===
                questions.length - 1
            ) {

                showFinal();

                return;

            }


            currentQuestion++;


            document.getElementById(
                "question"
            ).innerHTML =
                questions[
                    currentQuestion
                ].question;


            document.getElementById(
                "questionNumber"
            ).textContent =
                "SORU " +
                (currentQuestion + 1) +
                " / 6";


            document.getElementById(
                "buttons"
            ).style.display =
                "flex";


            document.getElementById(
                "result"
            ).style.display =
                "none";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* =========================
           FİNAL
        ========================== */

        function showFinal() {

            const question =
                document.getElementById(
                    "question"
                );


            const questionNumber =
                document.getElementById(
                    "questionNumber"
                );


            const buttons =
                document.getElementById(
                    "buttons"
                );


            const result =
                document.getElementById(
                    "result"
                );


            const message =
                document.getElementById(
                    "message"
                );


            questionNumber.textContent =
                "SON 💖";


            question.innerHTML =
                "Sorgu Tamamlandı 😝💗";


            buttons.style.display =
                "none";


            message.textContent =
                "Hehehe bütün soruları cevapladın 💖 Artık kaçış yok 😝🥰";


            result.style.display =
                "block";


            document.getElementById(
                "nextButton"
            ).style.display =
                "none";

        }

    </script>


</body>

</html>
